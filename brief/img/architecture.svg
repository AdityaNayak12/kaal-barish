<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="200" fill="#ffffff"/>

  <!-- browser -->
  <rect x="10" y="20" width="200" height="100" rx="8" fill="#eef4fb" stroke="#1f4e8c" stroke-width="2"/>
  <text x="110" y="47" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="110" y="70" text-anchor="middle">React + Leaflet</text>
  <text x="110" y="90" text-anchor="middle">map, shock builder,</text>
  <text x="110" y="109" text-anchor="middle">multiverse, impact</text>

  <!-- dashboard backend -->
  <rect x="260" y="20" width="210" height="100" rx="8" fill="#eef4fb" stroke="#1f4e8c" stroke-width="2"/>
  <text x="365" y="47" text-anchor="middle" font-weight="bold">Dashboard backend</text>
  <text x="365" y="70" text-anchor="middle">FastAPI :8001</text>
  <text x="365" y="90" text-anchor="middle">2021 sample windows,</text>
  <text x="365" y="109" text-anchor="middle">passes /simulate through</text>

  <!-- serve.py -->
  <rect x="520" y="20" width="200" height="100" rx="8" fill="#fdf1e6" stroke="#b5541b" stroke-width="2"/>
  <text x="620" y="47" text-anchor="middle" font-weight="bold">serve.py</text>
  <text x="620" y="70" text-anchor="middle">FastAPI :8000</text>
  <text x="620" y="90" text-anchor="middle">POST /simulate, /health</text>
  <text x="620" y="109" text-anchor="middle">validity gate + blend</text>

  <!-- CNN ensemble -->
  <rect x="770" y="20" width="220" height="100" rx="8" fill="#fdf1e6" stroke="#b5541b" stroke-width="2"/>
  <text x="880" y="47" text-anchor="middle" font-weight="bold">CNN ensemble</text>
  <text x="880" y="70" text-anchor="middle">r2 + r4, averaged</text>
  <text x="880" y="90" text-anchor="middle">rain gain 1.2,</text>
  <text x="880" y="109" text-anchor="middle">shock limiter 4.5 std</text>

  <!-- fallback -->
  <rect x="730" y="145" width="260" height="45" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="860" y="173" text-anchor="middle">Linear baseline: blend + fallback</text>

  <line x1="210" y1="70" x2="257" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="70" x2="517" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="70" x2="767" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620,120 L620,167 L727,167" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="612" y="150" text-anchor="end" fill="#555" font-size="13">blend input; sole model if the CNN fails</text>

  <text x="10" y="160" fill="#1f4e8c" font-size="13">HTTP only: the dashboard never imports model code</text>
  <text x="10" y="182" fill="#b5541b" font-size="13">Offline, CPU only: no internet, no weather APIs</text>
</svg>
